services:
  - type: worker
    name: qwake-agent
    runtime: docker
    dockerContext: apps/agent
    dockerfilePath: apps/agent/Dockerfile
    envVars:
      - key: PROJECT_ID
        sync: false
      - key: PROJECT_SECRET
        sync: false
      - key: BTL_API_KEY
        sync: false
      - key: BTL_MODEL
        value: deepseek-v4-flash
      - key: TELEGRAM_BOT_TOKEN
        sync: false
