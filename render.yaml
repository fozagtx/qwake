services:
  - type: worker
    name: qwake-agent
    runtime: bun
    rootDir: apps/agent
    buildCommand: bun install --frozen-lockfile
    startCommand: bun start
    envVars:
      - key: PROJECT_ID
        sync: false
      - key: PROJECT_SECRET
        sync: false
      - key: BTL_API_KEY
        sync: false
      - key: BTL_MODEL
        value: deepseek-v4-flash
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BUN_VERSION
        value: 1.3.10
